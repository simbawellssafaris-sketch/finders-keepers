<script>
  // year dropdown
  document.getElementById('yearToggle').addEventListener('click', function(e){
    this.classList.toggle('open');
  });

  // sticky tab nav "back to top" toggle
  const tabnav = document.getElementById('tabnav');
  window.addEventListener('scroll', () => {
    if (window.scrollY > 600) tabnav.classList.add('stuck');
    else tabnav.classList.remove('stuck');
  });

  // scrollspy for tabs
  const tabs = document.querySelectorAll('.tabnav a.tab');
  const sections = [...tabs].map(t => document.querySelector(t.getAttribute('href')));
  function onScroll(){
    let current = sections[0];
    const scrollPos = window.scrollY + 150;
    sections.forEach(function(sec){ if (sec && sec.offsetTop <= scrollPos) current = sec; });
    tabs.forEach(function(t){ t.classList.toggle('active', document.querySelector(t.getAttribute('href')) === current); });
  }
  window.addEventListener('scroll', onScroll);
  onScroll();

  // read more toggles — show only for long paragraphs

  // journey details panel toggles
  document.querySelectorAll('.jd-toggle').forEach(btn => {
    btn.addEventListener('click', () => {
      const panel = document.getElementById(btn.dataset.target);
      panel.classList.toggle('open');
      const isOpen = panel.classList.contains('open');
      btn.textContent = btn.textContent.replace(/[+\-]$/, '').trim() + (isOpen ? ' -' : ' +');
    });
  });
</script>
