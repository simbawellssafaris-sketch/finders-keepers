<script>
  const tabnav=document.getElementById('tabnav');
  window.addEventListener('scroll',()=>{if(window.scrollY>600)tabnav.classList.add('stuck');else tabnav.classList.remove('stuck');});
  const tabs=document.querySelectorAll('.tabnav a.tab');
  const secs=[...tabs].map(t=>document.querySelector(t.getAttribute('href')));
  function onScroll(){
    let current = secs[0];
    const scrollPos = window.scrollY + 150;
    secs.forEach(function(sec){ if (sec && sec.offsetTop <= scrollPos) current = sec; });
    tabs.forEach(function(t){ t.classList.toggle('active', document.querySelector(t.getAttribute('href')) === current); });
  }
  window.addEventListener('scroll',onScroll);onScroll();
</script>
