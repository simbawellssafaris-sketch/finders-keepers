<script>
(function(){
  var form = document.getElementById('footSubForm');
  if (!form) return;
  var fn = document.getElementById('footFirstName');
  var ln = document.getElementById('footLastName');
  var em = document.getElementById('footEmail');
  var note = document.getElementById('footFormNote');
  form.addEventListener('submit', function(e){
    e.preventDefault();
    [fn, ln, em].forEach(function(f){ f.classList.remove('fs-err'); });
    var bad = null;
    if (!fn.value.trim()) bad = fn;
    else if (!ln.value.trim()) bad = ln;
    else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em.value.trim())) bad = em;
    if (bad) {
      bad.classList.add('fs-err');
      note.textContent = 'Please fill in your first name, last name and a valid email address.';
      bad.focus();
      return;
    }
    // the sign-up itself is saved by the site (see lib/forms.js); nothing needs to be sent from the visitor's own email program
    form.reset();
    note.textContent = 'Thank you \u2014 you\'re on the list. A welcome note is on its way (check your spam folder if you don\'t see it).';
  });
})();
</script>
<!-- FS-FOOT-SUB:END -->
