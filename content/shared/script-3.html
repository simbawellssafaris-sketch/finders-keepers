<script>
(function(){
  document.querySelectorAll('.stays-grid.carousel').forEach(function(grid){
    var wrap = grid.closest('.stays-carousel-wrap');
    if(!wrap) return;
    var prev = wrap.querySelector('.stays-carousel-arrow.prev');
    var next = wrap.querySelector('.stays-carousel-arrow.next');
    function step(){
      var card = grid.querySelector('.stay-card');
      return card ? card.getBoundingClientRect().width + 24 : 300;
    }
    if(prev) prev.addEventListener('click', function(){ grid.scrollBy({left:-step(), behavior:'smooth'}); });
    if(next) next.addEventListener('click', function(){ grid.scrollBy({left:step(), behavior:'smooth'}); });
  });
})();
</script>
